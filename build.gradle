plugins {
    id 'java'
    id 'application'
}

group = 'com.wubot'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // Use custom KryoNet from game client (NOT standard Maven version!)
    implementation files('libs/client-kryonet.jar')

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

application {
    mainClass = 'com.wubot.WuBotApplication'
}

// Fat JAR with all dependencies
jar {
    manifest {
        attributes 'Main-Class': 'com.wubot.WuBotApplication'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = 'wubot'
    archiveVersion = ''
    archiveClassifier = ''
}

test {
    useJUnitPlatform()
}
